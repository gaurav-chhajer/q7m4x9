services:
  backend:
    build: ./backend
    volumes:
      - ./backend/data:/app/data:ro        # swap in a fresh snapshot without rebuilding
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # One-off: docker compose --profile ingest run --rm ingest
  ingest:
    image: python:3.12-slim
    profiles: ["ingest"]
    working_dir: /work
    volumes:
      - .:/work
    command: sh -c "pip install --quiet requests && python scripts/ingest.py"
